<nav class="navbar navbar-expand navbar-dark bg-primary">
  <a class="navbar-brand" href="#">
    <img src="logo.png" width="100" alt="ACME Logo">
  </a>
  <div>   
    <h1 id="titulo"> {{ title() }}</h1>
  </div>
</nav>

<div class="container mt-4">
  <div class="row mb-3">
    <div class="col-md-2">Filtrar por:</div>
    <div class="col-md-4">
      <input type="text" class="form-control"
             [value]="listFilter()" 
             (input)="listFilter.set($event.target.value)">
    </div>
  </div>
  
  <div class="row mb-3">
    <div class="col-md-6">
      <h5>Filtrado por: {{ listFilter() }}</h5>
    </div>
  </div>

  <app-product-list [datos]="filteredProducts()"></app-product-list>
</div>
