<div class="modal-backdrop fade show" style="background-color: rgba(0,0,0,0.5);"></div>

<div class="modal fade show d-block" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content shadow-lg border-0">
      
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
          <i class="bi bi-plus-circle me-2"></i>Crear Nuevo Producto
        </h5>
        <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="ocultarModal()"></button>
      </div>

      <div class="modal-body p-4">
        <form [formGroup]="form">
          <div class="row">
            <div class="col-md-8 mb-3">
              <label class="form-label fw-bold">Nombre del Producto</label>
              <input type="text" class="form-control" formControlName="productName" placeholder="Manga Black Clover Vol. 1">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label fw-bold">Código</label>
              <input type="text" class="form-control" formControlName="productCode" placeholder="BC-001">
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Fecha de Lanzamiento</label>
              <input type="date" class="form-control" formControlName="releaseDate">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Precio</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" class="form-control" formControlName="price" placeholder="10000">
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Rating (1.0 - 5.0)</label>
              <input type="number" class="form-control" formControlName="starRating" step="0.1" min="1" max="5" placeholder="4.5">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Descripción</label>
            <textarea class="form-control" formControlName="description" rows="2" placeholder="Detalles del producto..."></textarea>
          </div>
        </form>
      </div>

      <div class="modal-footer bg-light">
        <button type="button" class="btn btn-secondary" (click)="ocultarModal()">
          Cancelar
        </button>
        <button type="button" class="btn btn-primary" (click)="onSave()">
          <i class="bi bi-save me-1"></i> Guardar Producto
        </button>
      </div>

    </div>
  </div>
</div>
